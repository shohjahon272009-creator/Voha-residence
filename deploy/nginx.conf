# Nginx reverse proxy — Voha Residence
# Joylash:  /etc/nginx/sites-available/voha
# Yoqish:   ln -s /etc/nginx/sites-available/voha /etc/nginx/sites-enabled/
# Tekshir:  nginx -t   →   systemctl reload nginx
#
# SIZNING-DOMEN.uz  ni o'z domeningizga almashtiring (2 joyda).

server {
    listen 80;
    server_name SIZNING-DOMEN.uz www.SIZNING-DOMEN.uz;

    # Yuklanadigan rasmlar hajmi uchun (admin panelda katta rasm yuklash)
    client_max_body_size 25M;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# HTTPS ni Let's Encrypt avtomatik qo'shadi:
#   sudo certbot --nginx -d SIZNING-DOMEN.uz -d www.SIZNING-DOMEN.uz
# Shundan keyin certbot bu faylni 443/SSL bilan yangilaydi.
